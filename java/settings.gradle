rootProject.name = "opencode-proxy-java"

// Alias :routing (SPIs incl. ProxyPlugin, RoutingProfile, RateLimitInfo) from the nested core-proxy
// submodule, exactly as claude-code-proxy's java/settings.gradle does. opencode has no TeaVM logic
// to single-source (the passthrough nativeRateLimit is trivial) -- no :teavm include, no teavm module.
include ":routing"
project(":routing").projectDir = file("../core-proxy/java/routing")

// :ir - core-ir's canonical IR types + vendor translators (AnthropicTranslator etc.), aliased in
// exactly like :routing above (SP-3 T3a). core-ir is a DIRECT submodule of opencode-proxy
// (../core-ir from here, i.e. opencode-proxy/core-ir), not nested inside core-proxy. :routing's
// build.gradle references project(":ir") so this alias must resolve wherever :routing is
// included, exactly as claude-code-auth's/claude-code-proxy's java/settings.gradle does.
include ":ir"
project(":ir").projectDir = file("../core-ir/java/ir")

// :opencode-proxy-plugin -- the publishable *-proxy*.jar (OpencodeProxyPlugin, passthrough profile).
include ":opencode-proxy-plugin"
