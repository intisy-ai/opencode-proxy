plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "opencode-proxy-java"

// The routing vocabulary (:proxy-contracts), the IR types (:ir) and api's seam modules resolve as
// published jars through github-gradle. opencode has no TeaVM logic to single-source (the passthrough
// nativeRateLimit is trivial), so there is no teavm module here. Every module must name api at ONE
// coordinate: :ir exports api's seam types in HandlerCtx's public fields.

include ":opencode-proxy-plugin"
